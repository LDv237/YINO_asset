# TickForge spot long-only + strict durability variant (fsync every record).
# Same feed/factors as default; Simulator forbids naked sells and caps buys by cash.
# The data-stream.binance.vision host is Binance's public market-data-only
# endpoint. It is reachable from networks where stream.binance.com is not.

[feed]
ws_url = "wss://data-stream.binance.vision/stream"
rest_url = "https://data-api.binance.vision"
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT"]
depth_speed_ms = 100
stale_timeout_ms = 5000
open_timeout_s = 10.0
close_timeout_s = 2.0
ping_interval_s = 20.0
ping_timeout_s = 20.0
reconnect_initial_s = 0.5
reconnect_max_s = 30.0
message_max_bytes = 16777216
snapshot_limit = 5000
snapshot_timeout_s = 8.0
snapshot_retries = 5
snapshot_retry_backoff_s = 0.5

[wal]
segment_bytes = 67108864
fsync_interval_ms = 250
fsync_policy = "always"
queue_max = 500000
record_max_bytes = 8388608

[engine]
proc_queue_max = 200000
book_buffer_max = 50000
factor_interval_ms = 100
stats_interval_s = 10.0
health_interval_s = 1.0
drain_timeout_s = 30.0
max_processing_lag_ms = 2000

[strategy]
quote_notional_usd = 500.0
max_position_notional_usd = 5000.0
inventory_skew = 0.25
ofi_coeff_bps = 0.8
momentum_coeff = 0.35
min_half_spread_bps = 0.8
vol_half_spread_coeff = 0.6
max_half_spread_bps = 25.0
fee_bps = 1.0
quote_cooldown_ms = 100
enabled = true
allow_short = false
initial_cash_usd = 10000.0
round_to_tick = true

[http]
host = "127.0.0.1"
port = 9100
enabled = true

[run]
duration_s = 900.0
output_dir = "artifacts"
run_id = ""
log_level = "INFO"
seed = 7
