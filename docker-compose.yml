name: tickforge

services:
  tickforge:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: tickforge:0.1.0
    container_name: tickforge-live
    command:
      - live
      - --config
      - config/default.toml
      - --duration
      - "900"
      - --out
      - /data
    environment:
      TICKFORGE_HTTP_HOST: 0.0.0.0
      TICKFORGE_HTTP_PORT: "9100"
      TICKFORGE_OUTPUT_DIR: /data
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - ./artifacts:/data
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 3
