[project]
name = "tickforge"
version = "0.1.0"
description = "Real-time Binance market-data pipeline with WAL, factors, signals and deterministic replay"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.5",
  "orjson==3.13.0",
  "websockets==17.3",
  "psutil==7.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
